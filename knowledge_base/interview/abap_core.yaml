- id: ddic-domain-element
  topic: Data Dictionary
  level: basic
  question: What is the difference between a domain and a data element?
  key_points:
    - text: A domain defines technical attributes - data type, length and decimals - and optionally value ranges or fixed values.
      any: [technical, data type, length, value range, fixed value]
    - text: A data element gives semantic meaning - field labels, documentation and the search help.
      any: [semantic, field label, documentation, text, search help]
    - text: Several data elements can share one domain.
      any: [several data element, many data element, reuse, multiple data element, share]
    - text: A table field refers to a data element (or a built-in type directly).
      any: [table field, field refers, field uses]
  model_answer: >
    The domain holds technical attributes (type, length, value range); the data element adds meaning
    (labels, documentation, search help) and refers to a domain. Many data elements may share a domain, and
    table fields use data elements.

- id: ddic-object-types
  topic: Data Dictionary
  level: basic
  question: Which kinds of objects can you create in the ABAP Dictionary (SE11)?
