- id: ddic-foreign-key
  topic: Data Dictionary
  level: intermediate
  question: What is a foreign key relationship, and what is a check table?
  key_points:
    - text: A foreign key links a field of one table to the key of another (the check table).
      any: [link, key of another, key of the check, refers to]
    - text: The check table holds the valid values, so input is validated against it.
      any: [valid value, validate, input check, permitted values, holds the values]
    - text: It is used for the input check on screens and the value help; it does not enforce integrity in the database itself.
      any: [value help, screen, not enforced, application level, no database]
    - text: Fields must have the same domain.
      any: [same domain]
  model_answer: >
    A foreign key ties a field to the key of a check table that holds the allowed values. SAP uses it for
    input checks and value help on screens; it is not a database constraint. The fields share a domain.

- id: lock-objects
  topic: Data Dictionary
  level: intermediate
  question: How do lock objects work in SAP?
  key_points:
    - text: A lock object is created in SE11 and generates ENQUEUE_ and DEQUEUE_ function modules.
      any: [enqueue, dequeue, se11]
    - text: The lock is held in the enqueue server's lock table (SM12 shows locks).
      any: [sm12, lock table, enqueue server]
    - text: Lock modes are shared (S), exclusive (E) and exclusive but not cumulative (X).
      any: [shared, exclusive, mode]
    - text: Locks are released with DEQUEUE or automatically at the end of the transaction/program.
      any: [dequeue, released, end of transaction, end of the transaction, automatically]
  model_answer: >
    A lock object (SE11) generates ENQUEUE_<name> and DEQUEUE_<name> function modules. Locks live in the
    enqueue server's lock table (SM12), have modes shared, exclusive and exclusive-not-cumulative, and are
    released by DEQUEUE or at the end of the transaction.

- id: sap-luw
  topic: Transactions and updates
  level: advanced
  question: What is the difference between a database LUW and an SAP LUW, and how does update task work?
  key_points:
    - text: A database LUW is one database transaction ended by a database commit or rollback; it can end at a screen change.
      any: [database commit, database rollback, db commit, screen change]
    - text: An SAP LUW spans several dialog steps and is closed with COMMIT WORK or ROLLBACK WORK.
      any: [several dialog, commit work, rollback work, spans]
    - text: CALL FUNCTION ... IN UPDATE TASK registers an update function module that runs at COMMIT WORK.
      any: [update function, update module, at commit work, update work process]
    - text: Update modules run in an update work process, either synchronously or asynchronously (V1 / V2).
      any: [v1, v2, asynchronous, update work process]
  model_answer: >
    A database LUW is a single database transaction; an SAP LUW bundles several dialog steps and is ended with
    COMMIT WORK or ROLLBACK WORK. Update function modules registered IN UPDATE TASK run only at COMMIT WORK in an
    update work process (V1 for critical, V2 for non-critical updates).

- id: bapi-vs-rfc-idoc
  topic: Integration
  level: intermediate
  question: What are the differences between a BAPI, an RFC function module and an IDoc?
  key_points:
    - text: A BAPI is a standardised, released, RFC-enabled function module that is a method of a business object (BOR, SWO1).
      any: [business object, bor, swo1, released, standardised, standardized]
    - text: An RFC function module is any function module marked remote-enabled, callable from other systems.
      any: [remote-enabled, remote enabled, rfc]
    - text: An IDoc is an asynchronous, document-like message with segments, used for data exchange (WE02, WE19, partner profile).
      any: [segment, we02, we19, asynchronous, partner profile, message]
    - text: BAPIs do not commit; the caller must call BAPI_TRANSACTION_COMMIT and read the RETURN parameter (BAPIRET2).
      any: [bapi_transaction_commit, commit, bapiret2, return]
  model_answer: >
    A BAPI is a stable, released RFC-enabled function module exposing a business-object method; it does not
    commit, so you call BAPI_TRANSACTION_COMMIT and read RETURN (BAPIRET2). Any RFC-enabled function module can
    be called remotely. IDocs are asynchronous messages made of segments, configured with partner profiles and
    monitored in WE02/WE05.

- id: modularization
  topic: Modularization
  level: basic
  question: Which modularization units does ABAP offer, and which ones are recommended today?
  key_points:
    - text: Includes, macros and subroutines (FORM) are older techniques.
