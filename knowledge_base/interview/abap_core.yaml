    - text: Function modules, grouped in function groups, can be RFC-enabled and have import, export, changing, tables and exception parameters.
      any: [function module, function group, rfc]
    - text: Methods of classes are the recommended unit in modern ABAP.
      any: [method, class, recommended, object oriented, object-oriented]
    - text: Subroutines are obsolete in new development; macros hurt readability and debugging.
      any: [obsolete, discouraged, avoid, readability]
  model_answer: >
    Includes, macros, FORM subroutines, function modules (in function groups, RFC-capable) and methods. Use
    methods in classes today; FORMs are obsolete and macros hide logic.

- id: message-handling
  topic: Messages and authorizations
  level: basic
  question: How do you send messages in ABAP, and what do the message types mean?
  key_points:
    - text: Messages come from message classes maintained in SE91 and are issued with MESSAGE.
      any: [se91, message class, message statement]
    - text: Types - S success, I information, W warning, E error, A abort, X exit with a dump.
      any: [success, information, warning, error, abort]
    - text: Error messages stop processing in reports and returns to the selection screen or the field; type A terminates the transaction.
      any: [stops, terminate, back to, selection screen]
    - text: Placeholders &1..&4 are filled with WITH, or use MESSAGE ... INTO to get the text into a string.
      any: ["&1", message+with, message+into]
  model_answer: >
    Messages are defined in message classes (SE91) and sent with MESSAGE e001(zclass) WITH ... The types are S, I,
    W, E, A and X. An E message in a report ends processing at that point, A cancels the transaction, X causes a
    runtime error. MESSAGE ... INTO gets the text without displaying it.

- id: authority-check
  topic: Messages and authorizations
  level: intermediate
  question: How does an authorization check work in ABAP code?
  key_points:
    - text: AUTHORITY-CHECK OBJECT checks an authorization object against the user's profile.
      any: [authority-check, authorization object]
    - text: You pass field values with ID ... FIELD ..., for example ACTVT.
      any: [id+field, actvt]
    - text: sy-subrc = 0 means the user is authorised; any other value means no authorization.
      any: [sy-subrc, subrc]
    - text: Objects are maintained in SU21 and assigned to users through roles (PFCG).
      any: [su21, pfcg, role]
  model_answer: >
    AUTHORITY-CHECK OBJECT 'M_BEST_EKG' ID 'ACTVT' FIELD '01' ... then test sy-subrc (0 = authorised). Objects
    are defined in SU21 and granted via roles in PFCG; trace failures in SU53.
