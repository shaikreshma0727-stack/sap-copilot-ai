- id: selection-screen
  topic: ALV and reporting
  level: basic
  question: How do PARAMETERS and SELECT-OPTIONS differ, and what does a SELECT-OPTION contain?
  key_points:
    - text: PARAMETERS accepts one single value.
      any: [single value, one value, only one value, one single]
    - text: SELECT-OPTIONS accepts ranges and multiple selections.
      any: [range, multiple selection, multiple values, multiple ranges]
    - text: A select-option is an internal table with header fields SIGN, OPTION, LOW and HIGH.
      any: [sign, low+high]
    - text: It is used in the WHERE clause with IN.
      any: [where+in, in s_]
  model_answer: >
    PARAMETERS takes one value. SELECT-OPTIONS creates a range table with SIGN, OPTION, LOW, HIGH that
    allows intervals and several selections and is used with IN in the WHERE clause.

