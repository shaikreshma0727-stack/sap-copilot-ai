- name: BAPIRET2
  kind: structure
  module: BC
  description: Standard return structure of BAPIs (messages).
  keywords: [bapi return, bapi return message, bapiret2]
  status: unverified
  source: ""
  complete: true
  fields:
    - TYPE
    - ID
    - NUMBER
    - MESSAGE
    - LOG_NO
    - LOG_MSG_NO
    - MESSAGE_V1
    - MESSAGE_V2
    - MESSAGE_V3
    - MESSAGE_V4
    - PARAMETER
    - ROW
    - FIELD
    - SYSTEM
  notes: TYPE is the message type (S, W, E, I, A). The text is in MESSAGE.

