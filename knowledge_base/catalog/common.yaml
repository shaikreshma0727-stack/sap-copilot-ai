- name: BAPI_TRANSACTION_COMMIT
  kind: function_module
  module: BC
  description: Commits the database changes made by BAPI calls.
  keywords: [bapi commit, commit bapi, commit work and wait]
  status: unverified
  source: ""
  complete: true
  params:
    - {name: WAIT, direction: import, type: BAPITA-WAIT}
    - {name: RETURN, direction: export, type: BAPIRET2}
  notes: Call it after a successful BAPI that changes data. Pass WAIT = 'X' to wait for the update.

- name: BAPI_TRANSACTION_ROLLBACK
  kind: function_module
