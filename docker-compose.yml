services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sapcopilot
      POSTGRES_PASSWORD: sapcopilot
      POSTGRES_DB: sapcopilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapcopilot"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sapcopilot:sapcopilot@db:5432/sapcopilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
